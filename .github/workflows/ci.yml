name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # What the migrator promises is not expressible against a mock repo:
    # compare-and-swap against a concurrent writer, keyset resume across a
    # killed process, and the probe classifying an already-migrated row all
    # need real rows. So the database-backed tests are tagged :database and
    # this service is what lets CI run them.
    #
    # The suite must stay green with and without a database reachable, which
    # is test/test_helper.exs's job: it probes PGHOST/PGPORT and excludes the
    # :database tag when nothing answers, so a developer with no Postgres
    # running gets legible skips rather than a red gate they cannot explain.
    # Nothing in the gate command changes for the database - the connection
    # is described entirely by the PG* environment below, which is also what
    # a developer sets locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encryptor_ecto_test
        ports:
          - 5432:5432
        # Without a health check the job can reach the test stage before the
        # server accepts connections, and the probe would then legitimately
        # report "not reachable" and skip the very tests this service exists
        # to run - a green run that tested nothing.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ECTO_REQUIRE_DATABASE is the part that makes a green run mean something:
    # it turns "no database reachable" from a skip into a failure. A skip is
    # the right answer on a developer's machine and the wrong one here, where
    # a service container that failed to come up would otherwise produce a
    # green run that exercised none of the tests it exists for.
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: encryptor_ecto_test
      ECTO_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the toolchain: a version duplicated into
      # this file drifts the first time mise.toml moves. mise itself is not
      # used to provision CI - it would build Erlang from source.
      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # _build carries the Dialyzer PLT
      # (_build/dev/dialyxir_erlang-*_elixir-*_deps-dev.plt), so this cache is
      # the PLT cache too.
      #
      # The key is derived from mix.lock, and mix.lock is the whole pin here
      # even though one dependency is not a Hex package. `encryptor` is not
      # published yet, so it enters as a git dependency pinned to a SHA (see
      # mix.exs), and mix.lock records that SHA the same way it records a Hex
      # checksum - re-pinning the vault moves mix.lock, which moves this key.
      # deps/ is cached, so the vault's git clone is restored from the cache
      # rather than refetched on a hit; on a restore-keys fallback the
      # restored clone can be at the previously locked SHA, and the deps.get
      # below is what moves it to the one mix.lock names. Nothing here
      # authenticates to GitHub: riddler/encryptor is public and the lock
      # names it over https, so the default GITHUB_TOKEN and the read-only
      # `contents` permission above are all this job needs. No environment
      # variable steers dependency resolution - a path override for the vault
      # is a local-only thing and is never committed.
      #
      # Known tradeoff, the same one the satellites accept: a warm _build
      # means the compile stage is incremental, so warnings_as_errors only
      # sees files this push actually recompiles. Deleting the cache is how to
      # get a from-scratch compile when one is wanted.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # The gate is the whole job. It formats, compiles with warnings as
      # errors, runs credo --strict, dialyzer, the deps audit, and the full
      # suite with coverage, printing detail under any failing stage - so a
      # red run is diagnosable from this log alone. Three stages report as
      # skipped and always will: doctor, gettext, and sobelow, none installed
      # here (they are the manifest's not_applicable_skips).
      #
      # Same reasoning as the toolchain step, applied to the gate itself: the
      # command is read out of .claude/wurk.json rather than written here, so
      # the gate CI runs and the gate an agent must have green before
      # committing are one definition with one place to change it. A gate.full
      # that grows a flag is picked up on the next run, with nothing to
      # remember. It is read and executed inside the step rather than
      # interpolated into `run:`, so a repository file never reaches the shell
      # as expression text.
      - name: Full quality gate
        run: |
          set -euo pipefail
          mapfile -t cmd < <(jq -er '.gate.full[]' .claude/wurk.json)
          test "${#cmd[@]}" -gt 0 || { echo "gate.full is empty" >&2; exit 1; }
          echo "gate command (.claude/wurk.json gate.full): ${cmd[*]}"
          "${cmd[@]}"
