name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # What the migrator promises is not expressible against a mock repo:
    # compare-and-swap against a concurrent writer, keyset resume across a
    # killed process, and the probe classifying an already-migrated row all
    # need real rows. So the database-backed tests are tagged :database and
    # this service is what lets CI run them.
    #
    # The suite must stay green with and without a database reachable, which
    # is test/test_helper.exs's job: it probes PGHOST/PGPORT and excludes the
    # :database tag when nothing answers, so a developer with no Postgres
    # running gets legible skips rather than a red gate they cannot explain.
    # Nothing in the gate command changes for the database - the connection
    # is described entirely by the PG* environment below, which is also what
    # a developer sets locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encryptor_ecto_test
        ports:
          - 5432:5432
        # Without a health check the job can reach the test stage before the
        # server accepts connections, and the probe would then legitimately
        # report "not reachable" and skip the very tests this service exists
        # to run - a green run that tested nothing.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ECTO_REQUIRE_DATABASE is the part that makes a green run mean something:
    # it turns "no database reachable" from a skip into a failure. A skip is
    # the right answer on a developer's machine and the wrong one here, where
    # a service container that failed to come up would otherwise produce a
    # green run that exercised none of the tests it exists for.
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: encryptor_ecto_test
      ECTO_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the toolchain: a version duplicated into
      # this file drifts the first time mise.toml moves. mise itself is not
      # used to provision CI - it would build Erlang from source.
      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # _build carries the Dialyzer PLT
      # (_build/dev/dialyxir_erlang-*_elixir-*_deps-dev.plt), so this cache is
      # the PLT cache too.
      #
      # The key is derived from mix.lock, and mix.lock is the whole pin here.
      # Every dependency is a Hex package, `encryptor` included: mix.exs pins
      # the vault to one exact Hex version, and mix.lock records that version
      # and its checksum - re-pinning the vault moves mix.lock, which moves
      # this key.
      # deps/ is cached, so the fetched packages are restored from the cache
      # rather than refetched on a hit; on a restore-keys fallback a restored
      # package can be at the previously locked version, and the deps.get
      # below is what moves it to the one mix.lock names. Fetching the
      # dependencies needs no credential: every package comes from the public
      # Hex repository. No environment variable steers dependency resolution -
      # a path override for the vault is a local-only thing and is never
      # committed.
      #
      # Known tradeoff, the same one the satellites accept: a warm _build
      # means the compile stage is incremental, so warnings_as_errors only
      # sees files this push actually recompiles. Deleting the cache is how to
      # get a from-scratch compile when one is wanted.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # The gate is the whole job. It formats, compiles with warnings as
      # errors, runs credo --strict, dialyzer, the deps audit, and the full
      # suite with coverage, printing detail under any failing stage - so a
      # red run is diagnosable from this log alone. Three stages report as
      # skipped and always will: doctor, gettext, and sobelow, none installed
      # here (they are the manifest's not_applicable_skips).
      #
      # Same reasoning as the toolchain step, applied to the gate itself: the
      # command is read out of .claude/wurk.json rather than written here, so
      # the gate CI runs and the gate an agent must have green before
      # committing are one definition with one place to change it. A gate.full
      # that grows a flag is picked up on the next run, with nothing to
      # remember. It is read and executed inside the step rather than
      # interpolated into `run:`, so a repository file never reaches the shell
      # as expression text.
      - name: Full quality gate
        run: |
          set -euo pipefail
          mapfile -t cmd < <(jq -er '.gate.full[]' .claude/wurk.json)
          test "${#cmd[@]}" -gt 0 || { echo "gate.full is empty" >&2; exit 1; }
          echo "gate command (.claude/wurk.json gate.full): ${cmd[*]}"
          "${cmd[@]}"

  # The test suite on the oldest pair the package supports, beside the gate.
  #
  # Unlike the gate job, this pair is fixed here rather than read from
  # mise.toml, on purpose: mise.toml names the development and release pair,
  # while this job proves a consumer floor - Erlang/OTP 26 with Elixir 1.18 -
  # that the package promises to compile and pass on. The two move for
  # different reasons, so they live in different places. The versions are
  # loose ("26", "1.18") so setup-beam takes the newest patch of each line.
  #
  # Compile with warnings as errors plus the test suite, nothing else:
  # Dialyzer and Credo answer about the code rather than the runtime, and
  # they stay on the gate job.
  test-otp26:
    name: Tests on Erlang/OTP 26
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The same Postgres service and PG* environment as the gate job, for the
    # same reasons given there: the :database tests run here too, and
    # ECTO_REQUIRE_DATABASE turns an unreachable database into a failure
    # rather than a skip, so a green run means they ran on this pair.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encryptor_ecto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: encryptor_ecto_test
      ECTO_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "26"
          elixir-version: "1.18"

      # Keyed on the resolved pair and mix.lock, so it never shares an entry
      # with the gate job's cache.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Run the test suite
        run: mix test

  # A host already on hackney 1.x (through httpoison) resolves this package
  # with no committed lock, the way a real host would: the vault and the
  # engine come from Hex through this package's own ranges, beside the
  # host's ex_aws and KMS client stack. The fixture under
  # test/fixtures/hackney1_host/ names this checkout as a path dependency,
  # so a range this package narrows is caught here before a host meets it.
  #
  # No database and no cache: the job resolves and compiles, nothing more,
  # and a cached deps/ would let a stale resolution pass for a fresh one.
  hackney-1x:
    name: Host on hackney 1.x (Elixir 1.18 / OTP 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.18"

      - name: Resolve the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix deps.get

      - name: Compile the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix compile --warnings-as-errors

      - name: Show the host's resolved vault, engine, hackney and ex_aws
        working-directory: test/fixtures/hackney1_host
        run: grep -E '^  "(encryptor|aws_encryption_sdk|hackney|ex_aws)":' mix.lock | cut -d, -f1-3

  # The key store's Cloud KMS rows against a live test key, with Postgres,
  # beside the gate: Encryptor.Ecto.GcpKmsLiveTest
  # (test/encryptor/ecto/gcp_kms_live_test.exs) writes a "gcp_kms_ciphertext"
  # row on the test key, reads an encrypted field back through it, rotates
  # to a second row and shreds both with Encryptor.Ecto.KeyStore.shred/3.
  # Informational: no ruleset requires it.
  #
  # The credential is Workload Identity Federation, the same identity
  # encryptor's live Cloud KMS suite uses: the job's GitHub OIDC token is
  # exchanged for a short-lived one bound to a service account that may use
  # the test key only. There is no key file. The provider, the service
  # account and the key name are organisation SECRETS, never variables,
  # because a run log prints a variable in clear and masks a secret; a
  # secret is masked only as a whole string, so no step here derives, splits
  # or echoes one. Each secret reaches only the one step that needs it, and
  # the auth step exports nothing to later steps (its exported project id
  # would print unmasked): the test step is handed the credentials file it
  # wrote, and the last step removes that file whatever happened before it.
  #
  # The job runs its steps only when the three secrets are present and the
  # event is not from a fork or Dependabot (neither receives secrets).
  # Otherwise every step but the first is skipped and the first says why, so
  # the job is green and visibly skipped. The `secrets` context is not
  # allowed in an `if:`, hence the job-level flag. Neither the job nor the
  # test reads an AWS_ variable. ECTO_REQUIRE_GCP_KMS=1 makes an absent key
  # name a failure of the tagged tests rather than a skip, and
  # ECTO_REQUIRE_DATABASE=1 does the same for an unreachable Postgres, as in
  # the gate job.
  gcp-kms-integration:
    name: Cloud KMS integration (live test key)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    # The gate job's Postgres service, for the key store's table and the
    # field's.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encryptor_ecto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_GCP_KMS: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' && secrets.GCP_KMS_KEY != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: encryptor_ecto_test
      ECTO_REQUIRE_DATABASE: "1"

    steps:
      - name: Skip without the Cloud KMS secrets
        if: env.RUN_GCP_KMS != 'true'
        run: echo "::notice title=gcp-kms-integration skipped::the Cloud KMS secrets are absent, or this is a fork or Dependabot event; the live suite did not run"

      - uses: actions/checkout@v4
        if: env.RUN_GCP_KMS == 'true'

      - name: Read the toolchain out of mise.toml
        if: env.RUN_GCP_KMS == 'true'
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        if: env.RUN_GCP_KMS == 'true'
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with another job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        if: env.RUN_GCP_KMS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-gcp-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-gcp-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        if: env.RUN_GCP_KMS == 'true'
        run: mix deps.get

      - name: Authenticate to Google Cloud
        if: env.RUN_GCP_KMS == 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Run the gcp_kms_integration tests
        if: env.RUN_GCP_KMS == 'true'
        run: mix test --only gcp_kms_integration
        env:
          ECTO_REQUIRE_GCP_KMS: "1"
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          GCP_KMS_KEY: ${{ secrets.GCP_KMS_KEY }}

      # Removes the credentials file the auth step wrote, by the path it
      # answered, whether the tests passed, failed or never started. Prints
      # nothing.
      - name: Remove the credentials file
        if: always() && steps.gcp-auth.outputs.credentials_file_path != ''
        env:
          CREDENTIALS_FILE: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: rm -f -- "$CREDENTIALS_FILE"

  # An encrypted field through Postgres under a scoped vault on
  # Encryptor.Provider.Kms, against a live AWS KMS test key, beside the gate:
  # Encryptor.Ecto.AwsKmsLiveTest (test/encryptor/ecto/aws_kms_live_test.exs)
  # writes a field under the test key, reads it back, and reads it under
  # another scope's binding. The key store has no row shape AWS KMS wraps,
  # so this is where this package meets it. Informational: no ruleset
  # requires it.
  #
  # The credential is a role assumed with the job's GitHub OIDC token, the
  # same role encryptor's live AWS KMS suite and the aws-encryption-sdk-elixir
  # integration tests assume; there is no static access key. The role and
  # the key's ARN are organisation SECRETS, never variables, because a run
  # log prints a variable in clear and masks a secret; a secret is masked
  # only as a whole string, so no step here echoes one. The credential step
  # is a silent run step (its own comment says why) that hands the later
  # steps of this job temporary credentials (session token included) as
  # AWS_ variables, each masked first, so it runs last before the test step
  # and nothing after the test step prints the environment. Every AWS_
  # variable stays inside this job.
  #
  # The job runs its steps only when both secrets are present and the event
  # is not from a fork or Dependabot (neither receives secrets). Otherwise
  # every step but the first is skipped and the first says why, so the job
  # is green and visibly skipped. The `secrets` context is not allowed in an
  # `if:`, hence the job-level flag. ECTO_REQUIRE_AWS_KMS=1 makes an absent
  # key ARN a failure of the tagged tests rather than a skip, and
  # ECTO_REQUIRE_DATABASE=1 does the same for an unreachable Postgres, as in
  # the gate job.
  aws-kms-integration:
    name: AWS KMS integration (live test key)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    # The gate job's Postgres service, for the field's table.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encryptor_ecto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_AWS_KMS: ${{ secrets.AWS_ROLE_ARN != '' && secrets.KMS_KEY_ARN != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: encryptor_ecto_test
      ECTO_REQUIRE_DATABASE: "1"

    steps:
      - name: Skip without the AWS KMS secrets
        if: env.RUN_AWS_KMS != 'true'
        run: echo "::notice title=aws-kms-integration skipped::the AWS KMS secrets are absent, or this is a fork or Dependabot event; the live suite did not run"

      - uses: actions/checkout@v4
        if: env.RUN_AWS_KMS == 'true'

      - name: Read the toolchain out of mise.toml
        if: env.RUN_AWS_KMS == 'true'
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        if: env.RUN_AWS_KMS == 'true'
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with another job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        if: env.RUN_AWS_KMS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-aws-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-aws-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        if: env.RUN_AWS_KMS == 'true'
        run: mix deps.get

      # A run step rather than aws-actions/configure-aws-credentials, whose
      # log line after a successful assumption names the role's unique id in
      # clear. The account id and the role name, pieces of the role's ARN
      # that a whole-string mask would miss, are masked first, before any
      # output. `--query Credentials` keeps the assumed-role user (that id
      # and the ARN) out of the response, the call's stderr is discarded,
      # every value is masked before it is written anywhere, and a failure
      # prints one fixed line.
      - name: Assume the CI role
        if: env.RUN_AWS_KMS == 'true'
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          acct=$(cut -d: -f5 <<<"$ROLE_ARN"); role=${ROLE_ARN##*/}
          echo "::add-mask::${acct}"; echo "::add-mask::${role}"
          resp=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com") \
            || { echo "::error::could not obtain the OIDC token"; exit 1; }
          token=$(jq -r .value <<<"$resp")
          echo "::add-mask::${token}"
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" --role-session-name ci \
            --web-identity-token "$token" --duration-seconds 3600 \
            --query Credentials --output json 2>/dev/null) \
            || { echo "::error::the role assumption was refused"; exit 1; }
          ak=$(jq -r .AccessKeyId <<<"$creds")
          sk=$(jq -r .SecretAccessKey <<<"$creds")
          st=$(jq -r .SessionToken <<<"$creds")
          echo "::add-mask::${ak}"; echo "::add-mask::${sk}"; echo "::add-mask::${st}"
          {
            echo "AWS_ACCESS_KEY_ID=${ak}"
            echo "AWS_SECRET_ACCESS_KEY=${sk}"
            echo "AWS_SESSION_TOKEN=${st}"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      - name: Run the aws_kms_integration tests
        if: env.RUN_AWS_KMS == 'true'
        run: mix test --only aws_kms_integration
        env:
          ECTO_REQUIRE_AWS_KMS: "1"
          KMS_KEY_ARN: ${{ secrets.KMS_KEY_ARN }}
